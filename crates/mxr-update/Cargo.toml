[package]
name = "mxr-update"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }
semver = "1"
self-replace = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
